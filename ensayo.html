<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ensayo personal de diseño de videojuegos de Cristian Rodríguez Díaz."><title>Ensayo de diseño | Cristian Rodríguez Díaz</title><style>:root{color-scheme:dark;--bg:#0c1017;--panel:#202633;--line:#343c4b;--text:#f1f4fb;--muted:#a4aec1;--accent:#9cb5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,Segoe UI,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(900px,calc(100% - 44px));margin:auto}header{padding:22px 0;border-bottom:1px solid var(--line)}main{padding:55px 0 90px}h1{font-size:clamp(39px,7vw,70px);letter-spacing:-.05em;line-height:1.12;margin:15px 0}h2{font-size:25px;letter-spacing:-.03em;margin:0 0 12px}p{color:var(--muted)}.lead{font-size:19px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.block{padding:25px 0;border-top:1px solid var(--line);margin-top:20px}.body{white-space:pre-wrap;overflow-wrap:anywhere;color:#c3cbd9}.body p{color:inherit}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 34px}.tag{border:1px solid var(--line);border-radius:30px;padding:4px 11px;font-size:12px;color:#c3cbd9}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.gallery img,.heroimg{width:100%;height:auto;border:1px solid var(--line);border-radius:9px}.gallery img{aspect-ratio:16/9;object-fit:cover}footer{padding:25px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}@media(max-width:650px){.gallery{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><a href="game-studies.html">← Volver a ensayos de diseño</a></div></header><main class="wrap"><div id="essay"><p>Cargando ensayo…</p></div></main><footer><div class="wrap">© 2026 Cristian Rodríguez Díaz</div></footer><script>
(async()=>{
 const root=document.getElementById('essay'),id=new URLSearchParams(location.search).get('id');
 const make=(tag,txt,cls)=>{const el=document.createElement(tag);el.textContent=txt||'';if(cls)el.className=cls;return el};
 const validImage=path=>typeof path==='string'&&/^imagenes\/[a-z0-9_./-]+\.(png|jpe?g|webp|gif)$/i.test(path)&&!path.includes('..');
 const safeUrl=url=>typeof url==='string'&&/^https:\/\//i.test(url);
 const block=(name,value)=>{if(!value)return;const el=make('section','','block');el.append(make('h2',name),make('div',value,'body'));root.append(el)};
 try{
  if(!id)throw Error('No se indicó un ensayo');
  const response=await fetch('datos/game-studies.json',{cache:'no-store'});if(!response.ok)throw Error('Catálogo no disponible');
  const list=await response.json();const essay=list.find(x=>x&&x.visible!==false&&x.publicacion!=='borrador'&&x.publicacion!=='revision'&&(x.id||x.titulo)===id);if(!essay)throw Error('Ensayo no encontrado');
  document.title=essay.titulo+' | Ensayos de diseño';
  root.replaceChildren(make('div',(essay.tipo||'Ensayo')+(essay.fecha?' · '+essay.fecha:''),'eyebrow'),make('h1',essay.titulo));
  if(essay.descripcion)root.append(make('p',essay.descripcion,'lead'));
  if(essay.etiquetas){const tags=make('div','','tags');String(essay.etiquetas).split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>tags.append(make('span',t,'tag')));root.append(tags);}
  if(validImage(essay.imagen)){const im=make('img');im.src=essay.imagen;im.alt='Imagen del ensayo '+essay.titulo;im.className='heroimg';im.loading='lazy';root.append(im);}
  block('La pregunta de diseño',essay.objetivo);block('Hipótesis inicial',essay.hipotesis);block('Proceso y pruebas',essay.proceso);block('Conclusiones y aprendizajes',essay.conclusiones);if(essay.proyecto_relacionado){const related=make('p');const link=make('a','Ver proyecto relacionado ↗');link.href='proyecto.html?id='+encodeURIComponent(essay.proyecto_relacionado);related.append(link);root.append(related);}
  const gallery=String(essay.galeria||'').split(/\r?\n/).map(x=>x.trim()).filter(validImage);if(gallery.length){const section=make('section','','block');section.append(make('h2','Galería'));const grid=make('div','','gallery');gallery.forEach(src=>{const img=make('img');img.src=src;img.loading='lazy';img.alt='Captura del ensayo '+essay.titulo;grid.append(img)});section.append(grid);root.append(section);}
  for(const [name,url] of [['Ver vídeo o demostración ↗',essay.video],['Consultar enlace relacionado ↗',essay.url]]){if(safeUrl(url)){const p=make('p');const a=make('a',name);a.href=url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);root.append(p)}}
 }catch(e){root.replaceChildren(make('h1','Ensayo no disponible'),make('p',e.message));}
})();
</script></body></html>

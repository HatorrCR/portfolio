<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Lecturas, reflexiones y recursos sobre Game Studies de Cristian Rodríguez Díaz."><title>Game Studies | Cristian Rodríguez Díaz</title><style>:root{color-scheme:dark;--bg:#0c1017;--panel:#202633;--line:#343c4b;--text:#f1f4fb;--muted:#a4aec1;--accent:#9cb5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,Segoe UI,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(1040px,calc(100% - 44px));margin:auto}header{border-bottom:1px solid var(--line);padding:22px 0}main{padding:70px 0 90px}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.055em;line-height:1.1;margin:15px 0}p{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:38px}.card{background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:11px;min-width:0}.card h2{font-size:23px;margin:12px 0 8px;letter-spacing:-.03em}.type{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}.body{color:#c3cbd9;overflow-wrap:anywhere}.body p{color:inherit}.body img{max-width:100%}.body a{overflow-wrap:anywhere}.body ul{padding-left:22px}.external{display:inline-block;margin-top:12px;font-weight:650}footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding-top:48px}}</style></head><body><header><div class="wrap"><a href="index.html#investigacion">← Volver al portfolio</a></div></header><main class="wrap"><div class="eyebrow">Investigación e intereses académicos</div><h1>Game Studies</h1><p>Lecturas, apuntes, reflexiones y recursos sobre el estudio del videojuego. Un espacio para compartir lo que voy descubriendo, sin pretender sentar cátedra.</p><div id="entries" class="grid" aria-live="polite"></div></main><footer><div class="wrap">© 2026 Cristian Rodríguez Díaz</div></footer><script>(async()=>{const root=document.getElementById('entries');try{const response=await fetch('datos/game-studies.json',{cache:'no-store'});if(!response.ok)throw Error('No disponible');const items=await response.json();if(!Array.isArray(items)||!items.length){root.textContent='Todavía no hay entradas publicadas. Pronto iré compartiendo lecturas y reflexiones.';return;}for(const item of items){if(!item||!item.titulo)continue;const card=document.createElement('article');card.className='card';const type=document.createElement('div');type.className='type';type.textContent=item.tipo||'Game Studies';const title=document.createElement('h2');title.textContent=item.titulo;card.append(type,title);if(item.descripcion){const p=document.createElement('p');p.textContent=item.descripcion;card.append(p);}if(item.contenido){const content=document.createElement('div');content.className='body';content.textContent=item.contenido;card.append(content);}if(item.url&&/^https?:\/\//i.test(item.url)){const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.className='external';a.textContent='Consultar recurso ↗';card.append(a);}root.append(card);}}catch(e){root.textContent='No se ha podido cargar el contenido en este momento.';}})();</script></body></html>

name: Actualizar publicaciones

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Actualizar entrevistas y detectar publicaciones
        run: python scripts/actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entrevistas.html anuarios.html revistas.html datos/
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar archivo editorial de DeVuego'
            git push
          fi

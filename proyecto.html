<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Proyecto de diseño de videojuegos de Cristian Rodríguez Díaz"><title>Proyecto | Cristian Rodríguez Díaz</title><style>:root{color-scheme:dark;--bg:#0c1017;--panel:#202633;--text:#f1f4fb;--muted:#a4aec1;--accent:#9cb5ff;--line:#343c4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(960px,calc(100% - 44px));margin:auto}header{border-bottom:1px solid var(--line);padding:24px 0}.brand{font-weight:750;color:var(--text)}main{padding:70px 0 90px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.05em;line-height:1.1;margin:16px 0}h2{font-size:28px;margin:0 0 10px}p{color:var(--muted)}.lead{font-size:20px;max-width:720px}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0 40px}.tag{padding:4px 12px;border:1px solid var(--line);border-radius:30px;color:#c0c9d8;font-size:13px}.block{padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:16px}.block p{white-space:pre-wrap;margin-bottom:0}img{max-width:100%;height:auto;border-radius:10px}footer{padding:30px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}</style></head><body><header><div class="wrap"><a class="brand" href="index.html">Cristian Rodríguez Díaz</a></div></header><main class="wrap"><a href="index.html#proyectos">← Volver a proyectos</a><div id="content"><p>Cargando proyecto…</p></div></main><footer><div class="wrap">© 2026 Cristian Rodríguez Díaz · Game Designer</div></footer><script>
(async()=>{const root=document.getElementById('content');const id=new URLSearchParams(location.search).get('id');try{if(!id)throw Error('Proyecto no indicado');const r=await fetch('datos/proyectos.json',{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar el catálogo');const data=await r.json();const p=data.find(x=>x.id===id&&x.visible!==false);if(!p)throw Error('Proyecto no encontrado');document.title=(p.titulo||'Proyecto')+' | Cristian Rodríguez Díaz';root.replaceChildren();const make=(tag,txt,cls)=>{const e=document.createElement(tag);e.textContent=txt||'';if(cls)e.className=cls;return e};root.append(make('div',(p.estado||'Proyecto')+' / '+(p.genero||'Diseño de videojuegos'),'eyebrow'),make('h1',p.titulo),make('p',p.descripcion,'lead'));const tags=make('div','','tags');[p.motor,...String(p.etiquetas||'').split(',')].map(x=>String(x||'').trim()).filter(Boolean).forEach(t=>tags.append(make('span',t,'tag')));root.append(tags);if(p.imagen&&/^imagenes\/[a-z0-9_./-]+\.(webp|png|jpe?g|gif)$/i.test(p.imagen)&&!p.imagen.includes('..')){const im=document.createElement('img');im.src=p.imagen;im.alt='Captura de '+p.titulo;im.loading='lazy';root.append(im)}[['Mi aportación',p.aportacion],['Proceso de diseño',p.proceso],['Aprendizajes',p.aprendizajes]].forEach(([heading,value])=>{if(!value)return;const b=make('section','','block');b.append(make('h2',heading),make('p',value));root.append(b)});if(p.video&&/^https:\/\//i.test(p.video)){const a=make('a','Ver vídeo o demo ↗');a.href=p.video;a.target='_blank';a.rel='noopener noreferrer';root.append(a)}}catch(e){root.replaceChildren(make('h1','Proyecto no disponible'),make('p',e.message))}})();
</script></body></html>

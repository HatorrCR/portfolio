<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Plantilla de documentación de diseño de videojuegos para prototipos y experimentos."><title>Plantilla GDD | Cristian Rodríguez Díaz</title><style>:root{color-scheme:dark;--bg:#0c1017;--panel:#202633;--line:#343c4b;--text:#f1f4fb;--muted:#a4aec1;--accent:#9cb5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,Segoe UI,sans-serif}a{color:var(--accent);text-decoration:none}.wrap{width:min(860px,calc(100% - 44px));margin:auto}header{padding:22px 0;border-bottom:1px solid var(--line)}main{padding:55px 0 80px}h1{font-size:clamp(38px,6vw,65px);letter-spacing:-.05em;margin:12px 0}p{color:var(--muted)}.section{padding:20px 24px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:14px 0}.section h2{font-size:20px;margin:0 0 8px}.section p{margin:0}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:12px;letter-spacing:.15em}button{border:0;border-radius:7px;background:var(--accent);color:#0c1017;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}</style></head><body><header><div class="wrap"><a href="como-diseno.html">← Volver a cómo diseño</a></div></header><main class="wrap"><div class="eyebrow">Herramientas / Documentación</div><h1>Plantilla de GDD ligero</h1><p>Un guion para documentar ideas y prototipos. No es un proyecto publicado ni un diseño ya realizado. Puedes copiarlo y pegarlo en el campo «Documento de diseño (GDD)» de cualquier proyecto de Pages CMS.</p><button id="copy" type="button">Copiar plantilla</button><p id="status" role="status"></p><div id="sections"></div></main><script>const sections=[['Concepto y objetivo','¿Qué quiero diseñar? ¿Qué experiencia debería provocar?'],['Jugador y contexto','¿Para quién está pensado? ¿Qué sabe ya el jugador?'],['Core loop','¿Qué hace el jugador repetidamente y qué recibe a cambio?'],['Mecánicas y reglas','Acciones, recursos, restricciones, estados y condiciones de éxito o fallo.'],['Nivel, ritmo y orientación','Espacios, recorridos, pistas visuales y progresión de dificultad.'],['Referencias y alternativas','¿Qué soluciones he considerado y por qué?'],['Prototipo mínimo','¿Cuál es la versión más pequeña que permite poner a prueba la idea?'],['Pruebas y observaciones','¿Qué he probado? ¿Qué problemas o comportamientos he observado?'],['Iteraciones','¿Qué he cambiado, por qué y con qué resultado?'],['Conclusiones y siguientes pasos','¿Qué he aprendido? ¿Qué probaría después?']];const root=document.getElementById('sections');for(const [title,help]of sections){const div=document.createElement('section');div.className='section';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=help;div.append(h,p);root.append(div)}document.getElementById('copy').addEventListener('click',async()=>{const txt=sections.map(([title,help])=>title+'\n'+help+'\n\n').join('');try{await navigator.clipboard.writeText(txt);document.getElementById('status').textContent='Plantilla copiada.'}catch(e){document.getElementById('status').textContent='No se pudo copiar automáticamente. Puedes seleccionar el contenido de esta página.'}});</script></body></html>

name: Publicación de Cómo se juega
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: como-se-juega-publicacion-social
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main' && vars.BUFFER_ORGANIZATION_ID != '' && vars.BUFFER_INSTAGRAM_CHANNEL_ID != '' && vars.BUFFER_X_CHANNEL_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/publicacion_social.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}

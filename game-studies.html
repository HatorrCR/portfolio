<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ideas, pruebas y ensayos propios de diseño de videojuegos de Cristian Rodríguez Díaz."><title>Ensayos de diseño | Cristian Rodríguez Díaz</title><style>:root{color-scheme:dark;--bg:#0c1017;--panel:#202633;--line:#343c4b;--text:#f1f4fb;--muted:#a4aec1;--accent:#9cb5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,Segoe UI,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(1040px,calc(100% - 44px));margin:auto}header{border-bottom:1px solid var(--line);padding:22px 0}main{padding:70px 0 90px}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.055em;line-height:1.1;margin:15px 0}p{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:38px}.card{background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:11px;min-width:0}.card h2{font-size:23px;margin:12px 0 8px;letter-spacing:-.03em}.type{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}.body{color:#c3cbd9;overflow-wrap:anywhere}.body p{color:inherit}.body img{max-width:100%}.body a{overflow-wrap:anywhere}.body ul{padding-left:22px}.external{display:inline-block;margin-top:12px;font-weight:650}footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding-top:48px}} .filters{display:flex;gap:9px;flex-wrap:wrap;margin:26px 0 10px}.filters button{background:#202633;border:1px solid #343c4b;border-radius:8px;color:#c3cbd9;padding:9px 13px;cursor:pointer;font:inherit}.filters button[aria-pressed="true"]{background:#344363;border-color:#9cb5ff;color:white}.search{width:100%;max-width:560px;background:#202633;border:1px solid #343c4b;border-radius:8px;color:white;padding:12px 14px;font:inherit}.card-link{display:block;margin-top:16px;font-weight:700}.tag{font-size:12px;color:#b8c7e8}.empty{grid-column:1/-1} </style></head><body><header><div class="wrap"><a href="index.html#investigacion">← Volver al portfolio</a></div></header><main class="wrap"><div class="eyebrow">Mi laboratorio de ideas</div><h1>Ensayos de diseño</h1><p>Un espacio para compartir mis pruebas, ideas y experimentos con el diseño de videojuegos: mecánicas que estoy explorando, prototipos, decisiones de diseño y lo que voy aprendiendo por el camino.</p><div class="filters" id="filters" aria-label="Filtrar ensayos"></div><label for="essay-search" style="display:block;margin:18px 0 8px;color:#a4aec1;font-size:13px">Buscar por título, temática o tipo</label><input id="essay-search" class="search" type="search" placeholder="Buscar ensayos…"><div id="entries" class="grid" aria-live="polite"></div></main><footer><div class="wrap">© 2026 Cristian Rodríguez Díaz</div></footer><script>
(async()=>{
 const root=document.getElementById('entries'),filters=document.getElementById('filters'),search=document.getElementById('essay-search');
 let type='Todos';const types=['Todos','Ensayo','Prueba','Prototipo','Idea de diseño'];
 const make=(tag,txt,cls)=>{const el=document.createElement(tag);el.textContent=txt||'';if(cls)el.className=cls;return el};
 try{
  const response=await fetch('datos/game-studies.json',{cache:'no-store'});if(!response.ok)throw Error('No disponible');
  const items=(await response.json()).filter(x=>x&&x.titulo&&x.visible!==false);
  const render=()=>{
   const q=search.value.trim().toLocaleLowerCase('es');
   const found=items.filter(x=>(type==='Todos'||(x.tipo||'Ensayo')===type)&&[x.titulo,x.descripcion,x.etiquetas,x.tipo].some(v=>String(v||'').toLocaleLowerCase('es').includes(q)));
   root.replaceChildren();
   if(!found.length){root.append(make('p',items.length?'No hay ensayos que coincidan con la búsqueda.':'Todavía no hay ensayos publicados. Aquí iré compartiendo mis ideas y experimentos.','empty'));return;}
   for(const item of found){
    const card=make('article','','card');card.append(make('div',(item.tipo||'Ensayo')+(item.fecha?' · '+item.fecha:''),'type'),make('h2',item.titulo));
    if(item.descripcion)card.append(make('p',item.descripcion));
    if(item.etiquetas)card.append(make('div',item.etiquetas,'tag'));
    const link=make('a','Leer ensayo ↗','card-link');link.href='ensayo.html?id='+encodeURIComponent(item.id||item.titulo);card.append(link);root.append(card);
   }
  };
  for(const name of types){const btn=make('button',name);btn.type='button';btn.setAttribute('aria-pressed',String(type===name));btn.addEventListener('click',()=>{type=name;filters.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));render();});filters.append(btn);}
  search.addEventListener('input',render);render();
 }catch(e){root.textContent='No se ha podido cargar el contenido en este momento.';}
})();
</script></body></html>
